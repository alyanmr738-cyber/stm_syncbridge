name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --incremental false --skipLibCheck
      - run: npx vitest run
        env:
          ADMIN_SESSION_SECRET: ci-admin-session-secret-32chars-min
